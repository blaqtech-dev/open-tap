
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#24264A" />
  <title>You're Offline | The Open Tab</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F8F7F4;
      color: #24264A;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 420px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 2.4rem;
    }

    p {
      color: #777783;
      line-height: 1.7;
    }

    button {
      margin-top: 18px;
      padding: 13px 24px;
      border: 0;
      border-radius: 6px;
      background: #24264A;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>You're currently offline.</h1>
    <p>
      It looks like your internet connection is unavailable.
      Please reconnect and try again to continue reading The Open Tab.
    </p>
    <button onclick="window.location.reload()">
      Try Again
    </button>
  </main>
</body>
</html>
